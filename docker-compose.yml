services:
  secy:
    build: .
    image: secy

    environment:
      - SREAD_ROOT=/usr/local/lib/sread
      - SECY_STATE_DIR=/var/lib/secy/state
      # Uncomment for API key auth (pay-per-use) instead of OAuth
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      # Internal state — named volume shared between all secy services.
      # Contains findings, directives, patrol runs, watch queue, c2 progress.
      # Not directly visible on host — use 'docker compose exec' to inspect.
      - secy-state:/var/lib/secy/state

      # Issues — bind-mounted to host so the user can review and delete.
      # This is the only human-facing output directory.
      - ./issues:/var/lib/secy/state/issues

      # Host filesystem mounted read-only at /host
      - /:/host:ro

      # Claude Code OAuth credentials (for Pro/Max subscription auth)
      # Staged to /mnt — entrypoint.sh copies into the /root/.claude tmpfs.
      # Direct bind mount to /root/.claude/.credentials.json is shadowed by tmpfs.
      - ${HOME}/.claude/.credentials.json:/mnt/claude-credentials.json:ro

    # ── Security layers (defense in depth) ────────────────────────
    #
    # Layer 1: Docker container
    #   - Host filesystem is read-only (/host:ro)
    #   - Container runs as root (needed for full host file access)
    #   - IS_SANDBOX=1 tells Claude Code it's in a managed sandbox
    #   - Writes only to state volume, issues bind mount, and tmpfs
    #
    # Layer 2: Anthropic sandbox-runtime (srt) — if bwrap works in container
    #   - Network: only api.anthropic.com (no data exfiltration)
    #   - Filesystem: deny reads to shadow, SSH keys, credentials
    #   - enableWeakerNestedSandbox: true (Docker is the strong boundary)

    # Immutable container filesystem — only volumes and tmpfs are writable.
    # Prevents the agent from modifying sread config, blocklists, or its own prompt.
    read_only: true

    cap_drop:
      - ALL
    cap_add:
      # Read all files on the host regardless of ownership
      - DAC_READ_SEARCH
      # Required by bubblewrap (srt sandbox on Linux) — may not work in all Docker setups
      - SYS_ADMIN
      - NET_ADMIN

    tmpfs:
      - /tmp:size=64m
      - /root:size=64m

    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined

  # Long-lived daemon that watches Downloads for malware
  secy-watch:
    build: .
    image: secy

    command: ["watch"]
    restart: unless-stopped

    environment:
      - SREAD_ROOT=/usr/local/lib/sread
      - SECY_STATE_DIR=/var/lib/secy/state
      # Uncomment for API key auth (pay-per-use) instead of OAuth
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      - secy-state:/var/lib/secy/state
      - ./issues:/var/lib/secy/state/issues
      - /:/host:ro
      - ${HOME}/.claude/.credentials.json:/mnt/claude-credentials.json:ro

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - NET_ADMIN

    tmpfs:
      - /tmp:size=64m
      - /root:size=64m

    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined

  # Long-lived daemon that runs scheduled security scans and AI review
  secy-patrol:
    build: .
    image: secy

    command: ["patrol"]
    restart: unless-stopped

    environment:
      - SREAD_ROOT=/usr/local/lib/sread
      - SECY_STATE_DIR=/var/lib/secy/state
      # Uncomment for API key auth (pay-per-use) instead of OAuth
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      - secy-state:/var/lib/secy/state
      - ./issues:/var/lib/secy/state/issues
      - /:/host:ro
      - ${HOME}/.claude/.credentials.json:/mnt/claude-credentials.json:ro

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - NET_ADMIN

    tmpfs:
      - /tmp:size=64m
      - /root:size=64m

    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined

  # C2 supervisory daemon — correlates findings across watch + patrol
  secy-c2:
    build: .
    image: secy

    command: ["c2"]
    restart: unless-stopped

    environment:
      - SREAD_ROOT=/usr/local/lib/sread
      - SECY_STATE_DIR=/var/lib/secy/state
      # Uncomment for API key auth (pay-per-use) instead of OAuth
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      - secy-state:/var/lib/secy/state
      - ./issues:/var/lib/secy/state/issues
      - /:/host:ro
      - ${HOME}/.claude/.credentials.json:/mnt/claude-credentials.json:ro

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - NET_ADMIN

    tmpfs:
      - /tmp:size=64m
      - /root:size=64m

    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined

  # ── Test profile ──────────────────────────────────────────────────
  # docker compose --profile test run --rm secy-test

  # Container pre-filled with simulated threat artifacts matching THREATS.md.
  # Shares PID + network namespace with secy-test so sread can scan its
  # processes and listeners.
  threatlab:
    build:
      context: .
      dockerfile: threatlab/Dockerfile
    volumes:
      - threatlab-fs:/export
    healthcheck:
      test: ["CMD", "test", "-f", "/export/.ready"]
      interval: 1s
      retries: 30
    profiles: ["test"]

  # Runs sread modules against threatlab artifacts and asserts expected
  # detections. Exit 0 = all tests pass.
  secy-test:
    build: .
    pid: "service:threatlab"
    network_mode: "service:threatlab"
    cap_add:
      - DAC_READ_SEARCH
      - SYS_PTRACE
      - SYS_ADMIN
    environment:
      - SREAD_ROOT=/usr/local/lib/sread
    volumes:
      - threatlab-fs:/host:ro
      - secy-state:/var/lib/secy/state
      - ./threatlab/run-tests.sh:/opt/threatlab/run-tests.sh:ro
    depends_on:
      threatlab:
        condition: service_healthy
    entrypoint: ["bash", "/opt/threatlab/run-tests.sh"]
    profiles: ["test"]

volumes:
  secy-state:
  threatlab-fs:
