#!/usr/bin/env bash
# secy configuration

# Maximum iterations per mode
AUDIT_MAX_ITERATIONS=3
MONITOR_MAX_ITERATIONS=2
BASELINE_MAX_ITERATIONS=1

# Claude CLI settings
CLAUDE_MODEL="sonnet"
MAX_BUDGET_USD="1.00"

# Tools Claude is allowed to use (restricts attack surface)
# Bash: shell commands (find, grep, awk, diff, tail, sread, etc.)
# Read: read files directly
# Write: write findings/progress/baseline to state dir
# Grep: search file contents by pattern
# Glob: find files by name pattern
ALLOWED_TOOLS="Bash,Read,Write,Grep,Glob"

# State directory (override with SECY_STATE_DIR env var for Docker)
STATE_DIR="${SECY_STATE_DIR:-${SREAD_ROOT}/../state}"

# Sleep between iterations (seconds)
ITERATION_SLEEP=2

# ── Watch mode settings ──────────────────────────────────────────

# Poll interval for scanning Downloads directories (seconds)
WATCH_POLL_INTERVAL=5

# Max files to send to Claude in a single analysis batch
WATCH_BATCH_SIZE=10

# Skip files larger than this (bytes) — 50MB
WATCH_MAX_FILE_SIZE=52428800

# How deep to scan inside Downloads (1 = no recursion into subdirs)
WATCH_SCAN_DEPTH=1

# ── Patrol mode settings ─────────────────────────────────────────

# Main loop tick interval (seconds) — how often to check if modules are due
PATROL_TICK_INTERVAL=10

# Minimum interval between Claude reviews (seconds) — 30 minutes
# High-priority diffs bypass this and trigger immediate review
PATROL_REVIEW_INTERVAL=1800

# Budget per Claude review invocation (USD)
PATROL_REVIEW_BUDGET_USD="0.50"

# ── C2 mode settings ────────────────────────────────────────────

# Fallback poll interval if inotify fails (seconds)
C2_POLL_INTERVAL=30

# Minimum seconds between Claude invocations (debounce)
C2_DEBOUNCE_INTERVAL=300

# Budget per C2 invocation (USD)
C2_REVIEW_BUDGET_USD="0.75"

# Max findings to include in a single C2 review
C2_MAX_FINDINGS_PER_REVIEW=20

# Historical findings to include for context
C2_CONTEXT_WINDOW=10

# ── Directive settings (all services) ───────────────────────────

# How often services check for directive updates (seconds)
DIRECTIVE_CHECK_INTERVAL=60
